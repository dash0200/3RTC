[workspace]
resolver = "3"
members = ["crates/protocol", "crates/games", "crates/core", "crates/signaling", "crates/rtc", "crates/engine", "crates/ui", "crates/platform-win", "crates/audio", "crates/webview", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "ISC"
repository = "https://github.com/dash0200/3RTC"
publish = false

[workspace.dependencies]
# our crates
rtc-protocol = { path = "crates/protocol" }
rtc-core = { path = "crates/core" }
rtc-games = { path = "crates/games" }
rtc-signaling = { path = "crates/signaling" }
rtc-webrtc = { path = "crates/rtc" }
rtc-engine = { path = "crates/engine" }
rtc-ui = { path = "crates/ui" }
rtc-platform-win = { path = "crates/platform-win" }
rtc-audio = { path = "crates/audio" }
rtc-webview = { path = "crates/webview" }

# third party (one version each; cargo-deny checks for duplicates)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
unicode-segmentation = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
librqbit = { version = "9.1", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"
urlencoding = "2.1"
sha2 = "0.10"
url = "2"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# selected pedantic lints
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
used_underscore_binding = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Debug builds: our code stays quick to compile, dependencies (audio, WebRTC glue) run fast
[profile.dev.package."*"]
opt-level = 2

# The game rules too: the chess computer thinks on the deciding app, and the golden vectors replay
# thousands of games in the tests
[profile.dev.package.rtc-games]
opt-level = 2

# LiveKit's webrtc-sys with one change: never use Windows' built-in (DMO) echo canceller, which
# records silence on some laptops. See vendor/README.md.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
