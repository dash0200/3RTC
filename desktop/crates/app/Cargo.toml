[package]
name = "rtc-app"
description = "3RTC desktop app: the GPUI window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "3rtc"
path = "src/main.rs"

[dependencies]
rtc-protocol.workspace = true
rtc-core.workspace = true
rtc-games.workspace = true
rtc-engine.workspace = true
rtc-ui.workspace = true
rtc-platform-win.workspace = true
rtc-webview.workspace = true
gpui-kit = "0.9.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# chat picture previews (the same formats gpui already builds the crate with: no new crates)
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
qrcode = { version = "0.14", default-features = false }
ureq.workspace = true
sha2.workspace = true
url.workspace = true
urlencoding.workspace = true
librqbit.workspace = true
librqbit-dualstack-sockets.workspace = true

# build.rs links the logo into 3rtc.exe as its icon (Windows only); GPUI already uses this crate
# for its manifest, so nothing new comes into the tree
[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true
